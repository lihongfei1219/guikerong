[pytest]
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
testpaths = tests
pythonpath = src tests
python_files =
    test_*.py
    *_tests.py
    tests.py
addopts =
    --maxfail=1
    --capture=no
    --tb=auto
    --cov=src/guikerong_finance
    --cov-report=term-missing:skip-covered
    --cov-report=xml:cov.xml
    --junitxml=report.xml
    --cov-fail-under=80
    -vv
asyncio_mode = auto
env =
    server__use_ray=false
    server__enable_proxy=false
    load_builtin_plugins=[]
    sentry__enable=false
    test__silent=true
