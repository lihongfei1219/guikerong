
[project]
name = "guikerong_finance"
version = "0.0.0"
description = "桂科融 V3 企业金融产品匹配与人工协作"
readme = "README.md"
authors = [{ name = "GZHU", email = "gzhu@example.com" }]
requires-python = ">=3.11"
dependencies = [
  "loguru>=0.7.3",
  "pydantic>=2.11.7",
  "framex-kit==0.4.2",
  "mindforge-kit==0.0.40",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "sqlmodel>=0.0.24,<0.1",
  "openai>=1.0,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.16.1",
  "poethepoet>=0.36.0",
  "pre-commit>=4.2.0",
  "ruff==0.12.0",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "pytest-env>=1.1.5",
  "pytest-asyncio>=1.1.0",
  "pytest-recording>=0.13.4",
]


[project.scripts]
guikerong_finance = "guikerong_finance.__main__:main"

[project.optional-dependencies]
release = ["poethepoet>=0.36.0", "python-semantic-release>=10.2.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guikerong_finance"]

[tool.uv]
default-groups = []
override-dependencies = ["poethepoet>=0.36.0"]
prerelease = "allow"

[tool.poe]
include = "poe_tasks.toml"

[[tool.uv.index]]
name = "custom-repo"
url = "http://172.22.121.51:8081/repository/pypi-public/simple"
publish-url = "http://172.22.121.51:8081/repository/pypi-releases/"
default = true
